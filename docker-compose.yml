services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: youshorts
      POSTGRES_PASSWORD: youshorts
      POSTGRES_DB: youshorts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://youshorts:youshorts@postgres:5432/youshorts?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: replace-this-with-a-long-random-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-youshorts}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://youshorts:youshorts@postgres:5432/youshorts?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-youshorts}
      YT_DLP_PATH: /usr/local/bin/yt-dlp
      FFMPEG_PATH: ffmpeg
      WORK_DIR: /tmp/youshorts
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
